services:
  - type: web
    name: formiq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: formiq-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: formiq-db
    databaseName: formiq
    user: formiq
    plan: free
